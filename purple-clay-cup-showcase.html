<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Handcrafted Purple Clay Cup · Step 1–7 Guide</title>
  <style>
    :root {
      --xuan-paper: #f5f2eb;
      --silk-card: #faf8f4;
      --ink-deep: #1b1d1c;
      --ink-medium: #4a4f4c;
      --celadon: #3b5749;
      --zisha-clay: #7b4b3a;
      --cinnabar: #9b3528;
      --hairline: rgba(27, 29, 28, 0.14);
      --hairline-strong: rgba(27, 29, 28, 0.28);
      --serif: "Playfair Display", "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--xuan-paper);
      color: var(--ink-deep);
      font-family: var(--sans);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(245, 242, 235, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--hairline-strong);
    }

    .topbar {
      max-width: 720px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--ink-deep);
    }

    .seal {
      background: var(--zisha-clay);
      color: #fff;
      font-family: var(--serif);
      font-size: 0.7rem;
      padding: 4px 6px;
      border-radius: 2px;
      letter-spacing: 0.06em;
    }

    .brand-title {
      font-family: var(--serif);
      font-size: 1rem;
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-top {
      background: var(--silk-card);
      border: 1px solid var(--hairline-strong);
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--ink-deep);
      text-decoration: none;
      cursor: pointer;
      border-radius: 6px;
    }

    .btn-lang {
      background: var(--celadon);
      color: #fff;
      border-color: var(--celadon);
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 16px;
    }

    .now-playing-bar {
      background: var(--silk-card);
      border: 1px solid var(--hairline-strong);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }

    .now-playing-status {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink-medium);
      margin-bottom: 8px;
    }

    audio {
      width: 100%;
      height: 36px;
      display: block;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    @media (max-width: 480px) {
      .keypad-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
    }

    .num-key {
      appearance: none;
      background: var(--silk-card);
      border: 1.5px solid var(--hairline-strong);
      border-radius: 12px;
      padding: 12px 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.16s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .num-key .circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--zisha-clay);
      color: #fff;
      font-family: var(--serif);
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .num-key .short-label {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--ink-deep);
      text-align: center;
      line-height: 1.2;
    }

    .num-key .zh-sub-label {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--ink-medium);
      text-align: center;
      line-height: 1.2;
    }

    .num-key.playing {
      background: var(--cinnabar);
      border-color: var(--cinnabar);
    }

    .num-key.playing .circle {
      background: #fff;
      color: var(--cinnabar);
    }

    .num-key.playing .short-label,
    .num-key.playing .zh-sub-label {
      color: #fff;
    }

    .steps-heading {
      font-family: var(--serif);
      font-size: 1.15rem;
      margin-bottom: 14px;
      color: var(--ink-deep);
    }

    .cup-steps-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 580px) {
      .cup-steps-list {
        grid-template-columns: 1fr 1fr;
      }
    }

    .cup-step-card {
      background: var(--silk-card);
      border: 1px solid var(--hairline-strong);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .cup-step-card.active-step {
      border: 2px solid var(--cinnabar);
    }

    .cup-step-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .cup-step-badge {
      background: var(--zisha-clay);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
    }

    .cup-step-title {
      font-family: var(--serif);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--ink-deep);
    }

    .cup-step-svg {
      background: #f3ece2;
      border-radius: 8px;
      padding: 6px;
      margin-bottom: 8px;
    }

    .cup-step-desc {
      font-size: 0.82rem;
      color: var(--ink-medium);
      line-height: 1.45;
    }
  </style>
</head>
<body>

  <header>
    <div class="topbar">
      <a href="index.html" class="brand">
        <span class="seal">紫砂</span>
        <span class="brand-title" id="brand-title">PURPLE CLAY CUP DIY (STEP 1–7)</span>
      </a>
      <div class="top-actions">
        <a href="index.html" class="btn-top" id="back-btn">← Main Site</a>
        <button type="button" class="btn-top btn-lang" id="lang-btn" onclick="toggleLang()">中文 / EN</button>
      </div>
    </div>
  </header>

  <main>
    <div class="now-playing-bar">
      <div class="now-playing-status" id="now-playing-label">Tap Step 01 – 07 below to play audio</div>
      <audio id="main-audio" controls preload="none"></audio>
    </div>

    <div class="keypad-grid" id="keypad-grid"></div>

    <h3 class="steps-heading" id="steps-heading">Step 1 – 7 Illustrated Guide</h3>
    <div class="cup-steps-list" id="cup-steps-list"></div>
  </main>

        svg: `<svg viewBox="0 0 320 130" width="100%" height="115">

      },
      {

        shortEn: "Wrap & 45° Seam",
        shortZh: "围身筒与斜接",

        svg: `<svg viewBox="0 0 320 130" width="100%" height="115">
          <ellipse cx="95" cy="96" rx="46" ry="12" fill="#643b2e"/>
          <path d="M 49 36 L 49 96 A 46 12 0 0 0 141 96 L 141 36 Z" fill="#8c5846" stroke="#432821" stroke-width="2"/>

          <line x1="118" y1="32" x2="118" y2="102" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4 3"/>
          <circle cx="235" cy="66" r="32" fill="none" stroke="#8c5846" stroke-width="10"/>
          <line x1="242" y1="45" x2="275" y2="25" stroke="#c0392b" stroke-width="3"/>
          <text x="235" y="116" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold">45° Bevel Cut Through Overlap</text>
        </svg>`
      },
      {

        shortEn: "Slip & Base",

        badgeZh: "第 05 步",
        file: "assets/audio/cup_05_step4_attach_base.mp3?v=p2",
        titleEn: "Bevel Rim, Apply Clay Paste & Attach Base",
        titleZh: "内口削 45° 斜坡、涂脂泥并拍紧杯底",
        descEn: "Trim a 45° inner bevel along the top rim, spread purple clay paste (slip) evenly around the slope, place your pre-sealed bottom disc on top, tap firmly around the edge with the wooden paddle, and trim.",
        descZh: "沿上口内侧削一圈45°斜坡，涂匀紫砂脂泥浆，放上已封孔的杯底圆片，用木拍子沿边缘拍实并修齐底足。",
        svg: `<svg viewBox="0 0 320 130" width="100%" height="115">
          <rect x="95" y="54" width="12" height="52" fill="#8c5846" stroke="#432821" stroke-width="1.5"/>
          <rect x="213" y="54" width="12" height="52" fill="#8c5846" stroke="#432821" stroke-width="1.5"/>
          <circle cx="101" cy="52" r="4.5" fill="#d8bca9" stroke="#b84a39" stroke-width="1.5"/>
          <circle cx="219" cy="52" r="4.5" fill="#d8bca9" stroke="#b84a39" stroke-width="1.5"/>
          <rect x="92" y="38" width="136" height="12" rx="2" fill="#9c6652" stroke="#432821" stroke-width="2"/>
          <rect x="106" y="14" width="108" height="14" rx="3" fill="#c69c6d" stroke="#5c3d1e" stroke-width="2"/>
          <text x="160" y="120" text-anchor="middle" fill="#432821" font-size="11" font-weight="bold">45° Inner Bevel + Clay Paste + Paddle Base</text>

      {

        descEn: "Gently flip the cup right-side up in the center of the turntable. Fold a damp smoothing cloth over the knife-cut lip and spin the wheel steadily until the drinking rim is rounded and silky.",
        descZh: "双手轻托将杯身正面朝上翻正，用湿润水布包覆刀切杯口，匀速转动转盘，使杯沿变得圆润光滑、触唇舒适。",
        svg: `<svg viewBox="0 0 320 130" width="100%" height="115">
          <ellipse cx="160" cy="104" rx="85" ry="16" fill="#95a5a6" stroke="#2c3e50" stroke-width="2"/>
          <path d="M 112 36 L 112 96 A 48 11 0 0 0 208 96 L 208 36 Z" fill="#8c5846" stroke="#432821" stroke-width="2"/>

        descEn: "Use a stylus to engrave your initials, date, or motif—or brush contrasting slip on the wall. Be sure to sign your initials clearly on the underside of the base so you can identify your cup after the 1,180°C firing!",
        descZh: "用竹刻刀刻写姓名缩写、日期或泥绘图案。请务必在杯底清晰刻上姓名缩写，以便1180℃高温出窑后认领专属紫砂杯！",
        svg: `<svg viewBox="0 0 320 130" width="100%" height="115">

    function playStep(idx) {
      var st = STEPS[idx];
      var audio = document.getElementById("main-audio");
      if (currentIdx === idx && !audio.paused) {
        audio.pause();
        return;
      }
      currentIdx = idx;
      audio.src = st.file;
      audio.play();
      syncUI();
    }

    function syncUI() {
      var isZh = lang === "zh";
      var audio = document.getElementById("main-audio");
      var isPlaying = !audio.paused && !audio.ended && currentIdx >= 0;

      document.querySelectorAll(".num-key").forEach(function(btn, i) {
        btn.classList.toggle("playing", i === currentIdx && isPlaying);
      });

      document.querySelectorAll(".cup-step-card").forEach(function(card, i) {
        card.classList.toggle("active-step", i === currentIdx);
      });

      var labelEl = document.getElementById("now-playing-label");
      if (currentIdx >= 0) {
        var st = STEPS[currentIdx];
        var prefix = isPlaying ? (isZh ? "🔊 正在播放：" : "🔊 Playing: ") : (isZh ? "⏸ 已暂停：" : "⏸ Paused: ");
        labelEl.textContent = prefix + (isZh ? st.badgeZh : st.badgeEn) + " · " + (isZh ? st.titleZh : st.titleEn);
      } else {
        labelEl.textContent = isZh ? "点击下方 01 – 07 数字直接播放语音" : "Tap Step 01 – 07 below to play audio";
      }
    }

    function render() {
      var isZh = lang === "zh";
      document.getElementById("brand-title").textContent = isZh ? "手工紫砂杯制作 (1–7步)" : "PURPLE CLAY CUP DIY (STEP 1–7)";
      document.getElementById("back-btn").textContent = isZh ? "← 返回主站" : "← Main Site";
      document.getElementById("lang-btn").textContent = isZh ? "EN / 中文" : "中文 / EN";
      document.getElementById("steps-heading").textContent = isZh
        ? "紫砂杯制作 1–7 步图文简介（点击数字或卡片播放语音）"
        : "Step 1 – 7 Illustrated Guide (Tap number or card to play audio)";

      document.getElementById("keypad-grid").innerHTML = STEPS.map(function(st, i) {
        return '<button type="button" class="num-key" onclick="playStep(' + i + ')">' +
          '<span class="circle">' + st.num + '</span>' +
          '<span class="short-label">' + st.shortEn + '</span>' +
          '<span class="zh-sub-label">' + st.shortZh + '</span>' +
        '</button>';
      }).join("");

      document.getElementById("cup-steps-list").innerHTML = STEPS.map(function(st, i) {
        return '<div class="cup-step-card" onclick="playStep(' + i + ')">' +
          '<div class="cup-step-head">' +
            '<span class="cup-step-badge">' + (isZh ? st.badgeZh : st.badgeEn) + '</span>' +
            '<span class="cup-step-title">' + (isZh ? st.titleZh : st.titleEn) + '</span>' +
          '</div>' +
          '<div class="cup-step-svg">' + st.svg + '</div>' +
          '<div class="cup-step-desc">' + (isZh ? st.descZh : st.descEn) + '</div>' +
        '</div>';
      }).join("");

      syncUI();
    }

    function toggleLang() {
      lang = lang === "en" ? "zh" : "en";
      render();
    }

    var audioEl = document.getElementById("main-audio");
    audioEl.addEventListener("play", syncUI);
    audioEl.addEventListener("pause", syncUI);
    audioEl.addEventListener("ended", syncUI);

    render();
  </script>
</body>
</html>
