<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yixing Audio Guide</title>
  <style>
    :root {
      --xuan-paper: #f5f2eb;
      --silk-card: #faf8f4;
      --ink-deep: #1b1d1c;
      --ink-medium: #4a4f4c;
      --ink-light: #7c827d;
      --celadon: #3b5749;
      --zisha-clay: #6e483b;
      --cinnabar: #9b3528;
      --gold-leaf: #b08d57;
      --hairline: rgba(27, 29, 28, 0.14);
      --hairline-strong: rgba(27, 29, 28, 0.28);
      --serif: "Playfair Display", "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--xuan-paper);
      color: var(--ink-deep);
      font-family: var(--sans);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(245, 242, 235, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--hairline-strong);
    }

    .topbar {
      max-width: 680px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--ink-deep);
    }

    .seal {
      background: var(--cinnabar);
      color: #fff;
      font-family: var(--serif);
      font-size: 0.7rem;
      padding: 4px 6px;
      border-radius: 2px;
      letter-spacing: 0.06em;
    }

    .brand-title {
      font-family: var(--serif);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-top {
      background: var(--silk-card);
      border: 1px solid var(--hairline-strong);
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--ink-deep);
      text-decoration: none;
      cursor: pointer;
      border-radius: 6px;
    }

    .btn-lang {
      background: var(--celadon);
      color: #fff;
      border-color: var(--celadon);
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 18px 16px;
    }

    /* Collapsible Attraction Picker */
    .picker-bar {
      position: relative;
      margin-bottom: 18px;
    }

    .picker-trigger {
      width: 100%;
      padding: 14px 18px;
      background: var(--zisha-clay);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: var(--serif);
      font-size: 1.05rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(27, 29, 28, 0.12);
      -webkit-tap-highlight-color: transparent;
    }

    .picker-trigger .caret {
      font-family: var(--sans);
      font-size: 0.78rem;
      background: rgba(255, 255, 255, 0.18);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .picker-menu {
      display: none;
      margin-top: 8px;
      background: var(--silk-card);
      border: 1px solid var(--hairline-strong);
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 12px 28px rgba(27, 29, 28, 0.14);
      flex-direction: column;
      gap: 6px;
    }

    .picker-menu.open {
      display: flex;
    }

    .picker-option {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--hairline);
      background: var(--xuan-paper);
      color: var(--ink-deep);
      border-radius: 8px;
      font-family: var(--serif);
      font-size: 0.96rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .picker-option.active {
      background: var(--ink-deep);
      color: #fff;
      border-color: var(--ink-deep);
    }

    /* Compact Now Playing Bar */
    .now-playing-bar {
      background: var(--silk-card);
      border: 1px solid var(--hairline-strong);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 18px;
    }

    .now-playing-status {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink-medium);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    audio {
      width: 100%;
      height: 36px;
      display: block;
    }

    /* Simple Tap-to-Play Numbered Keypad */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    @media (min-width: 520px) {
      .keypad-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .num-key {
      appearance: none;
      background: var(--silk-card);
      border: 1.5px solid var(--hairline-strong);
      border-radius: 12px;
      padding: 16px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.16s ease;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 2px 6px rgba(27, 29, 28, 0.04);
    }

    .num-key .circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--cinnabar);
      color: #fff;
      font-family: var(--serif);
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.16s ease;
    }

    .num-key .short-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--ink-deep);
      text-align: center;
      line-height: 1.2;
    }

    .num-key .zh-sub-label {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--ink-medium);
      text-align: center;
      line-height: 1.2;
    }

    .num-key.playing {
      background: var(--cinnabar);
      border-color: var(--cinnabar);
      box-shadow: 0 6px 16px rgba(155, 53, 40, 0.28);
    }

    .num-key.playing .circle {
      background: #fff;
      color: var(--cinnabar);
      transform: scale(1.06);
    }

    .num-key.playing .short-label,
    .num-key.playing .zh-sub-label {
      color: #fff;
    }

    /* Clay Cup DIY Simple Step 1-7 Visual Guide Below Keypad */
    .cup-steps-section {
      display: none;
      margin-top: 26px;
      border-top: 1px solid var(--hairline-strong);
      padding-top: 20px;
    }

    .cup-steps-section.visible {
      display: block;
    }

    .cup-steps-heading {
      font-family: var(--serif);
      font-size: 1.15rem;
      margin-bottom: 14px;
      color: var(--ink-deep);
    }

    .cup-steps-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 580px) {
      .cup-steps-list {
        grid-template-columns: 1fr 1fr;
      }
    }

    .cup-step-card {
      background: var(--silk-card);
      border: 1px solid var(--hairline-strong);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .cup-step-card.active-step {
      border: 2px solid var(--cinnabar);
    }

    .cup-step-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .cup-step-badge {
      background: #7b4b3a;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
    }

    .cup-step-title {
      font-family: var(--serif);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--ink-deep);
    }

    .cup-step-svg {
      background: #f3ece2;
      border-radius: 8px;
      padding: 6px;
      margin-bottom: 8px;
    }

    .cup-step-desc {
      font-size: 0.82rem;
      color: var(--ink-medium);
      line-height: 1.45;
    }
  </style>
</head>

    function togglePickerMenu() {
      var menu = document.getElementById("picker-menu");
      var caret = document.getElementById("picker-caret");
      var isOpen = menu.classList.toggle("open");
      var isZh = guideLang === "zh";
      caret.textContent = isOpen
        ? (isZh ? "收起 ▴" : "Close ▴")
        : (isZh ? "切换景点 ▾" : "Switch ▾");
    }

    function selectZone(zoneKey) {
      currentZone = zoneKey;
      currentStopIdx = -1;
      var audio = document.getElementById("main-audio");
      audio.pause();
      audio.removeAttribute("src");
      audio.load();

      // Automatically hide picker menu after selecting
      var menu = document.getElementById("picker-menu");
      menu.classList.remove("open");

      renderPage();
    }

    function playStop(idx) {
      var zone = ZONES[currentZone];
      var stop = zone.stops[idx];
      var audio = document.getElementById("main-audio");

      if (currentStopIdx === idx && !audio.paused) {
        audio.pause();
        return;
      }

      currentStopIdx = idx;
      audio.src = stop.file;
      audio.play();
      updateActiveUI();
    }

    function updateActiveUI() {
      var isZh = guideLang === "zh";
      var zone = ZONES[currentZone];
      var audio = document.getElementById("main-audio");
      var isPlaying = !audio.paused && !audio.ended && currentStopIdx >= 0;

      document.querySelectorAll(".num-key").forEach(function(btn, i) {
        if (i === currentStopIdx && isPlaying) {
          btn.classList.add("playing");
        } else {
          btn.classList.remove("playing");
        }
      });

      document.querySelectorAll(".cup-step-card").forEach(function(card, i) {
        if (i === currentStopIdx) {
          card.classList.add("active-step");
        } else {
          card.classList.remove("active-step");
        }
      });

      var labelEl = document.getElementById("now-playing-label");
      if (currentStopIdx >= 0) {
        var s = zone.stops[currentStopIdx];
        var stateTxt = isPlaying ? (isZh ? "🔊 正在播放：" : "🔊 Playing: ") : (isZh ? "⏸ 已暂停：" : "⏸ Paused: ");
        labelEl.textContent = stateTxt + s.num + " · " + s.en + " / " + s.zh;
      } else {
        labelEl.textContent = isZh ? "点击下方数字按钮直接播放语音" : "Tap any number below to play audio";
      }
    }

    function renderPage() {
      var isZh = guideLang === "zh";
      var zone = ZONES[currentZone];

      document.getElementById("brand-title").textContent = isZh ? "宜兴实景语音导览" : "YIXING AUDIO GUIDE";
      document.getElementById("back-btn").textContent = isZh ? "← 返回主站" : "← Main Site";
      document.getElementById("lang-btn").textContent = isZh ? "EN / 中文" : "中文 / EN";

      var trigger = document.getElementById("picker-trigger");
      trigger.style.background = zone.color;
      document.getElementById("current-zone-title").textContent = isZh ? zone.titleZh : zone.titleEn;
      document.getElementById("picker-caret").textContent = isZh ? "切换景点 ▾" : "Switch ▾";

      document.querySelectorAll(".picker-option").forEach(function(opt) {
        var z = opt.getAttribute("data-zone");
        opt.classList.toggle("active", z === currentZone);
        var span = opt.querySelector("[data-en]");
        if (span) span.textContent = isZh ? span.getAttribute("data-zh") : span.getAttribute("data-en");
      });

      var grid = document.getElementById("keypad-grid");
      grid.innerHTML = zone.stops.map(function(s, idx) {
        return '<button type="button" class="num-key" onclick="playStop(' + idx + ')">' +
          '<span class="circle" style="background:' + zone.color + ';">' + s.num + '</span>' +
          '<span class="short-label">' + s.en + '</span>' +
          '<span class="zh-sub-label">' + s.zh + '</span>' +
        '</button>';
      }).join("");

      var cupSec = document.getElementById("cup-steps-section");
      if (currentZone === "cup") {
        cupSec.classList.add("visible");
        document.getElementById("cup-steps-heading").textContent = isZh
          ? "紫砂杯制作 1–7 步图文简介（点击卡片或上方数字播放语音）"
          : "Step 1 – 7 Visual Guide (Tap any step or number above to play audio)";
        document.getElementById("cup-steps-list").innerHTML = CUP_VISUAL_STEPS.map(function(st, idx) {
          return '<div class="cup-step-card" onclick="playStop(' + idx + ')">' +
            '<div class="cup-step-head">' +
              '<span class="cup-step-badge">' + (isZh ? st.badgeZh : st.badgeEn) + '</span>' +
              '<span class="cup-step-title">' + (isZh ? st.titleZh : st.titleEn) + '</span>' +
            '</div>' +
            '<div class="cup-step-svg">' + st.svg + '</div>' +
            '<div class="cup-step-desc">' + (isZh ? st.descZh : st.descEn) + '</div>' +
          '</div>';
        }).join("");
      } else {
        cupSec.classList.remove("visible");
      }

      updateActiveUI();
    }

    function toggleLang() {
      guideLang = guideLang === "en" ? "zh" : "en";
      renderPage();
    }

    var audioEl = document.getElementById("main-audio");
    audioEl.addEventListener("play", updateActiveUI);
    audioEl.addEventListener("pause", updateActiveUI);
    audioEl.addEventListener("ended", updateActiveUI);

    // Check URL hash (e.g. #zone-cup, #zone-shanjuan, #zone-museum)
    if (window.location.hash) {
      var h = window.location.hash.replace("#zone-", "").replace("#", "");
      if (ZONES[h]) currentZone = h;
    }

    renderPage();
  </script>
